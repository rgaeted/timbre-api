server:
  port: ${PORT:8081}
  forward-headers-strategy: framework
  tomcat:
    threads:
      max: 15

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/timbre}
    username: ${DB_USER:timbre}
    password: ${DB_PASSWORD:timbre}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 10000
      initialization-fail-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  task:
    scheduling:
      pool:
        size: ${SCHEDULING_POOL_SIZE:2}
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 2MB
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

sii:
  ambiente: ${SII_AMBIENTE:CERTIFICACION}
  cert-p12-base64: ${SII_CERT_P12_BASE64:}
  cert-password: ${SII_CERT_PASSWORD:}
  timeout-ms: ${SII_TIMEOUT_MS:20000}
  base-url: ${SII_BASE_URL:}
  envio-max-intentos: ${SII_ENVIO_MAX_INTENTOS:50}
  envio-backoff-ms: ${SII_ENVIO_BACKOFF_MS:900000}
  envio-job-fixed-delay-ms: ${SII_ENVIO_JOB_FIXED_DELAY_MS:60000}
  envio-consulta-delay-ms: ${SII_ENVIO_CONSULTA_DELAY_MS:600000}
  envio-job-enabled: ${SII_ENVIO_JOB_ENABLED:true}
  consulta-max-intentos: ${SII_CONSULTA_MAX_INTENTOS:50}
  consulta-backoff-ms: ${SII_CONSULTA_BACKOFF_MS:900000}
  consulta-job-fixed-delay-ms: ${SII_CONSULTA_JOB_FIXED_DELAY_MS:60000}
  consulta-job-enabled: ${SII_CONSULTA_JOB_ENABLED:true}

timbre:
  folio-alert-threshold: ${FOLIO_ALERT_THRESHOLD:20}
  admin-email: ${TIMBRE_ADMIN_EMAIL:}
  mail-from: ${TIMBRE_MAIL_FROM:}
  folio-alert:
    enabled: ${FOLIO_ALERT_ENABLED:true}
    cron: ${FOLIO_ALERT_CRON:0 6 * * *}

storage:
  provider: ${STORAGE_PROVIDER:local}
  local-dir: ${STORAGE_LOCAL_DIR:storage}
  bucket: ${R2_BUCKET:}
  endpoint: ${R2_ENDPOINT:}
  region: ${R2_REGION:auto}
  access-key: ${R2_ACCESS_KEY:}
  secret-key: ${R2_SECRET_KEY:}
  sync:
    enabled: ${STORAGE_SYNC_ENABLED:true}
    fixed-delay-ms: ${STORAGE_SYNC_FIXED_DELAY_MS:300000}
    batch-size: ${STORAGE_SYNC_BATCH_SIZE:100}
